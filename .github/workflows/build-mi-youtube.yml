name: Compilar Mi YouTube 1.3.1 Universal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout configuracion
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Clonar motor NewPipe estable y extractor exacto
        run: |
          git clone --depth 1 --branch v0.29.0 https://github.com/TeamNewPipe/NewPipe.git MiYouTube-src
          git init NewPipeExtractor
          git -C NewPipeExtractor remote add origin https://github.com/TeamNewPipe/NewPipeExtractor.git
          git -C NewPipeExtractor fetch --depth 1 origin 4de221bf67ec0bf8dbdf573fbc9d4412a8561cb0
          git -C NewPipeExtractor checkout --detach FETCH_HEAD

      - name: Preparar base Mi YouTube
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('MiYouTube-src')
          p = root / 'app/build.gradle.kts'
          s = p.read_text(encoding='utf-8')
          s = s.replace('applicationId = NEWPIPE_APPLICATION_ID_OLD', 'applicationId = "cl.servicioia.miyoutube"')
          s = s.replace('versionName = NEWPIPE_VERSION_NAME', 'versionName = "1.2.0"')
          s = re.sub(r'versionCode = System\.getProperty\("versionCodeOverride"\)\?\.toInt\(\) \?: NEWPIPE_VERSION_CODE', 'versionCode = System.getProperty("versionCodeOverride")?.toInt() ?: 1200', s)
          s = re.sub(r'resValue\("string", "app_name", "NewPipe[^\"]*"\)', 'resValue("string", "app_name", "Mi YouTube")', s)
          s = s.replace('applicationIdSuffix = ".debug"', 'applicationIdSuffix = ""')
          s = s.replace('applicationIdSuffix = ".debug.$normalizedWorkingBranch"', 'applicationIdSuffix = ""')
          p.write_text(s, encoding='utf-8')

          settings = root / 'settings.gradle.kts'
          st = settings.read_text(encoding='utf-8')
          st += '''\nincludeBuild("../NewPipeExtractor") {\n    dependencySubstitution {\n        substitute(module("com.github.TeamNewPipe:NewPipeExtractor"))\n            .using(project(":extractor"))\n    }\n}\n'''
          settings.write_text(st, encoding='utf-8')

          keys = root / 'app/src/main/res/values/settings_keys.xml'
          ks = keys.read_text(encoding='utf-8')
          ks = ks.replace('<string name="default_theme_value">@string/auto_device_theme_key</string>', '<string name="default_theme_value">@string/black_theme_key</string>')
          ks = ks.replace('<string name="default_night_theme_value">@string/dark_theme_key</string>', '<string name="default_night_theme_value">@string/black_theme_key</string>')
          keys.write_text(ks, encoding='utf-8')

          colors = root / 'app/src/main/res/values/colors_services.xml'
          cs = colors.read_text(encoding='utf-8')
          cs = cs.replace('#e53935', '#0F0F0F').replace('#992722', '#0F0F0F')
          cs = cs.replace('<color name="light_youtube_accent_color">#000000</color>', '<color name="light_youtube_accent_color">#FF0033</color>')
          cs = cs.replace('<color name="dark_youtube_accent_color">#FFFFFF</color>', '<color name="dark_youtube_accent_color">#FF0033</color>')
          colors.write_text(cs, encoding='utf-8')

      - name: Aplicar rediseño Mi YouTube 1.3.1 Universal
        run: python scripts/customize_mi_youtube_131.py

      - name: Corregir estilo Java del rediseño
        run: python scripts/fix_130_checkstyle.py

      - name: Validar recursos Universal y TV
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('MiYouTube-src')
          checks = [
              'app/src/main/res/layout/fragment_main.xml',
              'app/src/main/res/layout/list_stream_item.xml',
              'app/src/main/res/layout-television/fragment_main.xml',
              'app/src/main/res/layout-television/list_stream_item.xml',
              'app/src/main/res/layout/toolbar_layout.xml',
              'app/src/main/res/layout/drawer_header.xml',
              'app/src/main/res/drawable/ic_miyoutube_brand.xml',
              'app/src/main/res/drawable/premium_card.xml',
              'app/src/main/res/drawable/premium_search_bar.xml',
              'app/src/main/res/mipmap-anydpi/newpipe_tv_banner.xml',
          ]
          for rel in checks:
              ET.parse(root / rel)
          main = (root / 'app/src/main/java/org/schabi/newpipe/fragments/MainFragment.java').read_text(encoding='utf-8')
          assert 'premiumSearchButton' in main
          assert 'configureUniversalTvNavigation' in main
          assert 'KEYCODE_DPAD_CENTER' in main
          assert 'UI_MODE_TYPE_TELEVISION' in main
          gradle = (root / 'app/build.gradle.kts').read_text(encoding='utf-8')
          assert 'versionName = "1.3.1"' in gradle
          assert '1310' in gradle
          assert 'cl.servicioia.miyoutube' in gradle
          manifest = (root / 'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'android.hardware.touchscreen' in manifest
          assert 'android.software.leanback' in manifest
          assert 'android.intent.category.LEANBACK_LAUNCHER' in manifest
          assert 'android:required="false"' in manifest
          print('Validacion Universal 1.3.1 OK: movil + tablet + TV')

      - name: Compilar APK instalable 1.3.1
        working-directory: MiYouTube-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verificar APK y preparar entrega
        run: |
          mkdir -p salida
          APK=$(find MiYouTube-src/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" salida/Mi-YouTube-1.3.1-Universal.apk
          unzip -t salida/Mi-YouTube-1.3.1-Universal.apk >/dev/null
          unzip -l salida/Mi-YouTube-1.3.1-Universal.apk | grep -q 'AndroidManifest.xml'
          unzip -l salida/Mi-YouTube-1.3.1-Universal.apk | grep -q 'classes.dex'
          sha256sum salida/Mi-YouTube-1.3.1-Universal.apk > salida/Mi-YouTube-1.3.1-Universal.sha256.txt
          tar --exclude='.git' --exclude='*/build' -czf salida/Mi-YouTube-1.3.1-Universal-source.tar.gz MiYouTube-src NewPipeExtractor README.md scripts/customize_mi_youtube_130.py scripts/customize_mi_youtube_131.py scripts/fix_130_checkstyle.py

      - name: Subir APK 1.3.1 Universal
        uses: actions/upload-artifact@v4
        with:
          name: Mi-YouTube-1.3.1-Universal-APK
          path: |
            salida/Mi-YouTube-1.3.1-Universal.apk
            salida/Mi-YouTube-1.3.1-Universal.sha256.txt
          retention-days: 30

      - name: Subir codigo fuente 1.3.1 Universal
        uses: actions/upload-artifact@v4
        with:
          name: Mi-YouTube-1.3.1-Universal-source
          path: salida/Mi-YouTube-1.3.1-Universal-source.tar.gz
          retention-days: 30
