name: Compilar Mi YouTube 1.1.0

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout configuracion
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Clonar NewPipe 0.29.0 y extractor exacto
        run: |
          git clone --depth 1 --branch v0.29.0 https://github.com/TeamNewPipe/NewPipe.git MiYouTube-src
          git init NewPipeExtractor
          git -C NewPipeExtractor remote add origin https://github.com/TeamNewPipe/NewPipeExtractor.git
          git -C NewPipeExtractor fetch --depth 1 origin 4de221bf67ec0bf8dbdf573fbc9d4412a8561cb0
          git -C NewPipeExtractor checkout --detach FETCH_HEAD

      - name: Personalizar Mi YouTube 1.1.0 y enlazar extractor local
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('MiYouTube-src/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('applicationId = NEWPIPE_APPLICATION_ID_OLD', 'applicationId = "cl.servicioia.miyoutube"')
          s = s.replace('versionName = NEWPIPE_VERSION_NAME', 'versionName = "1.1.0"')
          s = re.sub(r'resValue\("string", "app_name", "NewPipe[^\"]*"\)', 'resValue("string", "app_name", "Mi YouTube")', s)
          s = s.replace('applicationIdSuffix = ".debug"', 'applicationIdSuffix = ""')
          s = s.replace('applicationIdSuffix = ".debug.$normalizedWorkingBranch"', 'applicationIdSuffix = ""')
          p.write_text(s, encoding='utf-8')

          settings = Path('MiYouTube-src/settings.gradle.kts')
          st = settings.read_text(encoding='utf-8')
          local_block = '''\nincludeBuild("../NewPipeExtractor") {\n    dependencySubstitution {\n        substitute(module("com.github.TeamNewPipe:NewPipeExtractor"))\n            .using(project(":extractor"))\n    }\n}\n'''
          if 'includeBuild("../NewPipeExtractor") {' not in st.replace('//    includeBuild', 'includeBuild'):
              st += local_block
          else:
              # The upstream file contains the same block commented out; append an active copy.
              st += local_block
          settings.write_text(st, encoding='utf-8')

          notice = Path('MiYouTube-src/MI-YOUTUBE-NOTICE.txt')
          notice.write_text(
              'Mi YouTube 1.1.0\n'
              'Basado en TeamNewPipe/NewPipe v0.29.0 y NewPipeExtractor commit 4de221bf67ec0bf8dbdf573fbc9d4412a8561cb0.\n'
              'Licencia GPL-3.0-or-later.\n'
              'Fuentes originales: https://github.com/TeamNewPipe/NewPipe y https://github.com/TeamNewPipe/NewPipeExtractor\n'
              'No es una aplicacion oficial de YouTube ni de NewPipe.\n',
              encoding='utf-8'
          )

      - name: Compilar APK instalable
        working-directory: MiYouTube-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Preparar APK y fuente
        run: |
          mkdir -p salida
          APK=$(find MiYouTube-src/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" salida/Mi-YouTube-1.1.0.apk
          sha256sum salida/Mi-YouTube-1.1.0.apk > salida/Mi-YouTube-1.1.0.sha256.txt
          tar --exclude='.git' --exclude='*/build' -czf salida/Mi-YouTube-1.1.0-source.tar.gz MiYouTube-src NewPipeExtractor README.md

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-YouTube-1.1.0-APK
          path: |
            salida/Mi-YouTube-1.1.0.apk
            salida/Mi-YouTube-1.1.0.sha256.txt
          retention-days: 30

      - name: Subir codigo fuente correspondiente
        uses: actions/upload-artifact@v4
        with:
          name: Mi-YouTube-1.1.0-source
          path: salida/Mi-YouTube-1.1.0-source.tar.gz
          retention-days: 30
