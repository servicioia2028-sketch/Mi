<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https:; img-src 'self' data: blob: https:; connect-src https:; media-src https: blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>Mi YouTube TV</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><img src="icon.png" alt=""><div><strong>Mi YouTube</strong><span>Smart TV</span></div></div>
    <button id="searchBox" class="search focusable">⌕ <span>Buscar videos, canales y más</span></button>
    <div id="networkStatus" class="status">Internet</div>
  </header>
  <nav class="chips" id="chips">
    <button class="chip focusable selected" data-query="música">Música</button>
    <button class="chip focusable" data-query="noticias">Noticias</button>
    <button class="chip focusable" data-query="tecnología">Tecnología</button>
    <button class="chip focusable" data-query="películas trailers">Películas</button>
    <button class="chip focusable" data-query="documentales">Documentales</button>
  </nav>
  <main>
    <section>
      <div class="section-title"><h2 id="sectionTitle">Recomendados</h2><span id="providerLabel">Contenido por Internet</span></div>
      <div id="grid" class="video-grid"></div>
      <div id="empty" class="empty hidden">No fue posible cargar contenido. Comprueba Internet e inténtalo nuevamente.</div>
    </section>
  </main>
  <footer class="bottomnav">
    <button class="navitem focusable selected" data-action="home">⌂<span>Inicio</span></button>
    <button class="navitem focusable" data-action="search">⌕<span>Buscar</span></button>
    <button class="navitem focusable" data-action="history">◷<span>Historial</span></button>
    <button class="navitem focusable" data-action="settings">⚙<span>Acerca de</span></button>
  </footer>
</div>
<div id="searchOverlay" class="overlay hidden">
  <div class="dialog">
    <h2>Buscar en Internet</h2>
    <input id="searchInput" class="focusable" type="text" placeholder="Escribe lo que quieres ver" autocomplete="off" />
    <div class="dialog-actions">
      <button id="doSearch" class="primary focusable">Buscar</button>
      <button id="cancelSearch" class="focusable">Cancelar</button>
    </div>
    <p>Usa el teclado en pantalla del televisor.</p>
  </div>
</div>
<div id="playerOverlay" class="player-overlay hidden">
  <div class="player-shell">
    <video id="videoPlayer" controls autoplay playsinline></video>
    <iframe id="youtubeFrame" class="hidden" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div class="player-meta"><h2 id="playerTitle"></h2><p id="playerChannel"></p></div>
    <button id="closePlayer" class="close-player focusable">← Volver</button>
  </div>
</div>
<script src="platform.js"></script>
<script src="app.js"></script>
</body>
</html>
